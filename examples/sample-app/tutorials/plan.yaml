# Example output of /tutorials:plan for the sample app, after approval.
status: approved
approved_at: 2026-10-29
audience: Team leads trying Acme Projects for the first time

items:
  - id: create-your-first-project
    kind: video
    title: Create your first project
    audience: New team leads
    role: owner
    goal: After this video you can create a project and add its first task.
    features: [dashboard-overview, create-project, manage-tasks]
    prerequisites: [Signed in]
    demo_data:
      - Only the three starting projects, with no "Office move" project from an earlier run
      - Three members, so the Owner list has choices
    duration_sec: 55
    steps:
      - Start on the Dashboard
      - Click New project
      - Enter a Project name and a Description
      - Choose an Owner
      - Click Create project, and the new project opens
      - Under New task, type a first task and click Add task
    opening: Everything in Acme lives in a project. Let's create your first one and give it a task.
    closing: That's your first project, with its first task. Next, find a project and tick off tasks.

  - id: find-a-project-and-tick-off-tasks
    kind: video
    title: Find a project and tick off tasks
    audience: New team leads
    role: owner
    goal: After this video you can find any project and mark its tasks done.
    features: [find-project, manage-tasks]
    prerequisites: [Signed in]
    demo_data:
      - Website relaunch with its three tasks, none ticked yet
    duration_sec: 35
    steps:
      - Open Projects from the sidebar
      - Check each project's Owner and number of Tasks
      - Click Website relaunch to open it
      - Tick Write homepage copy to mark it done
    opening: Your projects are always a click away. Here's how to find one and tick off finished tasks.
    closing: You can also jump into a project from Recent projects on the Dashboard. Next, see how your team is doing.

  - id: track-progress-and-export
    kind: video
    title: Track progress and export a CSV
    audience: New team leads
    role: owner
    goal: After this video you can check how your team is doing and download your projects as a CSV file.
    features: [dashboard-overview, view-reports, export-csv]
    prerequisites: [Signed in]
    demo_data:
      - The three starting projects with their tasks, so the CSV has rows
    duration_sec: 35
    steps:
      - Start on the Dashboard and read the headline numbers
      - Open Reports from the sidebar
      - Read Tasks completed and Average time to close
      - Click Export CSV to download every project with its task count
    opening: Want to know how your team is doing? Acme shows you in two places.
    closing: Open the file in any spreadsheet app to share it. Next, invite your team.

  - id: invite-a-teammate
    kind: both
    title: Invite a teammate
    audience: Workspace owners
    role: owner
    goal: After this, you can invite someone by email and choose their role.
    features: [view-members, invite-teammate]
    prerequisites: [Signed in as the workspace owner]
    demo_data:
      - An email address that isn't on the team yet, such as alex@example.com
      - No pending invites left over from an earlier run
    duration_sec: 35
    steps:
      - Open Settings from the sidebar
      - Click Members
      - Check who's already on the team and their roles
      - Under Invite a teammate, enter their Email address
      - Choose a Role, Member or Admin
      - Click Send invite
      - Check the confirmation and the new Invite pending row
    opening: Projects move faster with your team in them. Here's how to invite someone.
    closing: Invite the rest of your team the same way.

  - id: find-and-check-billing
    kind: sop
    title: Check your plan and invoices
    audience: Workspace owners
    role: owner
    goal: Confirm the current plan, seat count and renewal date, and look up a past invoice amount.
    features: [billing]
    prerequisites: [Signed in as the workspace owner]
    demo_data: [At least two past invoices]
    steps:
      - Open Settings from the sidebar
      - Click Billing
      - Read the plan, seat count and renewal date at the top
      - Find the month you need in the Invoice table and read its Amount
