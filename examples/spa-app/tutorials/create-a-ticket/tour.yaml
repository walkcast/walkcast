id: create-a-ticket
title: Log a new ticket
start: /
approved_at: 2026-10-29
approved_hash: 2e77d04dc8cfc49b
steps:
  - say: Every request starts as a ticket. Here's how to log one.
  - do: click
    target: New ticket
    say: Click New ticket at the top of any page.
    expect: The New ticket dialog
    expect_text: Describe the problem in a line.
    locator: { role: button, name: New ticket }
  - do: type
    target: Title
    text: Printer won't print in color
    say: Give it a short title that says what's wrong.
    cue: a short title
    locator: { role: textbox, name: Title }
  - do: click
    target: Priority
    say: Then set how urgent it is.
    cue: how urgent it is
    locator: { role: button, name: Priority }
  - do: click
    target: High
    say: Choose High if people can't work until it's fixed.
    locator: { role: menuitemradio, name: High }
  - do: click
    target: Create ticket
    say: Click Create ticket. It goes straight to the top of the inbox.
    expect: A Ticket created message, and the new ticket first in the inbox
    expect_text: [ Ticket created, Printer won't print in color ]
    locator: { role: button, name: Create ticket }
  - say: That's it. Next, see how to mark a ticket solved.
